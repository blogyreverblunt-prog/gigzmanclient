#   - full weekly hours (only "Closes 7 pm" is exposed signed-out)
# A search result titles their site "Nayra Realtors – The Keys To Your Homes",
# but nayrarealtors.com does not currently resolve, so no website is published
# here and the tagline is taken from the supplied logo instead — confirm the
# exact wording ("Home" vs "Homes") with the client.
#
# Property and locality inventory is duplicated from the high-properties
# template and is placeholder content — see `_status` and the header comment
# in each content/*.yaml.
#
# Loaded into the database by `pnpm seed:client nayra-realtors`.
# Run `pnpm check:content nayra-realtors` for the placeholder checklist.


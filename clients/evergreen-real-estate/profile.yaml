# Client seed data — Evergreen Real Estate (Premium V2 template)
#
# NAP below is read from the client's own Google Business Profile
# (place_id ChIJozjps20pDTkRbunfm45O_-k), rendered in a real browser since
# the listing is client-side only. Verified from that listing: name, category
# ("Real estate developer"), rating 4.6, address, phone, plus-code and
# coordinates. Google exposes only the current day's hours in the signed-out
# view — Thursday 07:00–21:00 was read directly and the same window is
